# No URI on proxy_pass: preserve /api, method, body and GitHub HMAC bytes.
proxy_pass http://127.0.0.1:3001;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host traceflow.dev;
proxy_set_header X-Forwarded-Host traceflow.dev;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Port 443;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Request-Id $request_id;
proxy_set_header Forwarded "";
proxy_set_header CF-Connecting-IP "";
proxy_set_header True-Client-IP "";
proxy_set_header X-Original-URL "";
proxy_set_header X-Rewrite-URL "";
proxy_cache off;
proxy_no_cache 1;
proxy_cache_bypass 1;
proxy_next_upstream off;
proxy_intercept_errors off;
# Request buffering defaults to on at the server; chunk routes stream explicitly.
proxy_hide_header Cache-Control;
proxy_hide_header Strict-Transport-Security;
add_header Cache-Control "no-store, no-transform" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Other API security headers and Set-Cookie are preserved from Express.
