# Included once inside http {}. Remove the vendor default server first;
# see OCI_RUNTIME_SERVICES.md. Compatible with nginx 1.20.1.
include /etc/nginx/traceflow/cloudflare.conf;
real_ip_header CF-Connecting-IP;
real_ip_recursive off;

# Fixed categories avoid identifiers/tokens in BOTH query strings and path segments.
map $uri $tf_route {
    default other;
    ~^/api/ api;
    ~^/assets/ asset;
    ~^/health(?:/|$) health;
    /api api;
    /index.html spa;
}
map $request_method $tf_method {
    default OTHER;
    GET GET;
    HEAD HEAD;
    POST POST;
    PUT PUT;
    PATCH PATCH;
    DELETE DELETE;
    OPTIONS OPTIONS;
}
map $http_host $tf_https_host {
    default 0;
    ~*^traceflow\.dev(?::443)?$ 1;
}
map $http_host $tf_http_host {
    default 0;
    ~*^traceflow\.dev(?::80)?$ 1;
}
log_format traceflow_safe escape=json
    '{"time":"$time_iso8601","requestId":"$request_id",'
    '"route":"$tf_route","method":"$tf_method","status":$status,'
    '"bytes":$body_bytes_sent,"duration":$request_time,'
    '"upstreamStatus":"$upstream_status","upstreamTime":"$upstream_response_time"}';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log /var/log/nginx/traceflow-access.log traceflow_safe;
    # nginx error logs cannot redact request lines. No request error log is retained.
    error_log /dev/null;
    server_tokens off;
    return 444;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_reject_handshake on;
    access_log /var/log/nginx/traceflow-access.log traceflow_safe;
    error_log /dev/null;
    server_tokens off;
    return 444;
}
server {
    listen 80;
    listen [::]:80;
    server_name traceflow.dev;
    access_log /var/log/nginx/traceflow-access.log traceflow_safe;
    error_log /dev/null;
    server_tokens off;
    if ($tf_http_host = 0) { return 444; }
    return 301 https://traceflow.dev$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name traceflow.dev;
    ssl_certificate /etc/nginx/ssl/traceflow-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/traceflow-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:TRACEFLOW_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    access_log /var/log/nginx/traceflow-access.log traceflow_safe;
    error_log /dev/null;

    if ($tf_https_host = 0) { return 444; }
    if ($ssl_server_name != traceflow.dev) { return 421; }
    # Original TCP peer, before realip replacement. Origin CA is NOT client auth.
    if ($tf_cloudflare_peer = 0) { return 403; }

    root /var/www/traceflow/current;
    index index.html;
    autoindex off;
    # Only the controlled current symlink may be followed, never links inside dist.
    disable_symlinks on from=$document_root;
    client_max_body_size 1m;
    client_header_timeout 15s;
    client_body_timeout 60s;
    send_timeout 60s;
    keepalive_timeout 15s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    include /etc/nginx/traceflow/static-headers.conf;
    error_page 413 = @payload_too_large;
    error_page 502 504 = @upstream_unavailable;
    location @payload_too_large {
        default_type application/json;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        return 413 '{"code":"INGRESS_PAYLOAD_TOO_LARGE","message":"A requisição excede o limite do proxy."}';
    }
    location @upstream_unavailable {
        default_type application/json;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        return 503 '{"code":"UPSTREAM_UNAVAILABLE","message":"Serviço temporariamente indisponível."}';
    }
    location = /api { include /etc/nginx/traceflow/proxy.conf; }
    location ^~ /api/ {
        include /etc/nginx/traceflow/proxy.conf;
        location ~ ^/api/projects/[^/]+/events$ {
            include /etc/nginx/traceflow/proxy.conf;
            proxy_buffering off;
            proxy_read_timeout 75s;
            gzip off;
        }
        location ~ ^/api/test-cases/[^/]+/executions$ {
            include /etc/nginx/traceflow/proxy.conf;
            # 100 MiB files + 6 MiB JSON + bounded multipart overhead.
            # Cloudflare's current 100 MB cap remains a DEPLOY BLOCKER.
            client_max_body_size 108m;
            proxy_read_timeout 90s;
        }
    }
    # Only the existing loopback Node endpoints are used by operational probes.
    location = /health { return 404; }
    location ^~ /health/ { return 404; }
    location ~ (^|/)\. { return 404; }
    location ~* ^/(?:src|node_modules|backend|deploy|prisma|logs|evidence|test-evidence|var|etc|opt)(?:/|$) { return 404; }
    location ~* (?:\.map|\.env|\.pem|\.key|\.log|\.sql|\.conf|\.ya?ml|\.toml|package(?:-lock)?\.json)$ { return 404; }

    # /assets contains ONLY Vite-generated content addressed by hash. OCI-05 must
    # merge retained assets into each active dist and prove identical-name bytes.
    location ~ "^/assets/[A-Za-z0-9_./-]+-[A-Za-z0-9_-]{8,}\.(?:js|css|png|jpe?g|svg|webp|gif|ico|woff2?|ttf|mp4|webm)$" {
        try_files $uri =404;
        include /etc/nginx/traceflow/static-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/traceflow/static-headers.conf;
        add_header Cache-Control no-cache always;
    }
    location = /index.html {
        try_files $uri =404;
        include /etc/nginx/traceflow/static-headers.conf;
        add_header Cache-Control no-cache always;
    }
    # Missing static files never become HTML. React paths have no file extension.
    location ~ /[^/]+\.[^/]+$ { try_files $uri =404; }
    location / { try_files $uri /index.html; }
}
